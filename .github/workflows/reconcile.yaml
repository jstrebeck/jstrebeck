# Reconciles this README from live state once a day and on demand:
#   1. re-renders the Argo CD style application rows (img/apps/) from the
#      GitHub API: description, language, stars, last push, latest CI result
#   2. renders the latest-post cards (img/posts/) from strebeck.net's RSS feed
#      and writes their grid into README.md
name: Reconcile

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
  push:
    paths:
      - apps.json
      - scripts/reconcile.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render rows, heatmap and post cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reconcile.py

      - name: Commit rendered panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/apps img/contributions.svg img/posts README.md
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Reconcile dashboard panels"
            git pull --rebase origin main
            git push
          fi
